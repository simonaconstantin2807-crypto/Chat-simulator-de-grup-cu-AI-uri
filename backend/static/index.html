<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Consiliul CoSiMa</title>
<style>
  :root {
    --bg: #f4f1ea;
    --panel: #ffffff;
    --text: #2c2c2c;
    --muted: #8a8580;
    --border: #e4ded2;
    --cerneala: #3d3a36;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
  }

  /* Coloana de chat ramane exact cum era; panoul de conversatii sta langa ea, nu peste ea. */
  .coloana {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  aside {
    width: 250px;
    min-width: 250px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }

  .cap-panou {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 12px 10px 16px;
  }

  .cap-panou h2 {
    flex: 1;
    margin: 0;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .buton-mic {
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font: inherit;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
  }

  .buton-mic:hover { border-color: var(--cerneala); }

  .lista-conversatii {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .conversatie {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 8px 6px 8px 10px;
    border-radius: 10px;
    cursor: pointer;
    border-left: 3px solid transparent;
  }

  .conversatie:hover { background: var(--bg); }

  .conversatie.activa {
    background: var(--bg);
    border-left-color: var(--cerneala);
  }

  .conversatie .nume-conversatie {
    flex: 1;
    min-width: 0;
    font-size: 0.85rem;
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .conversatie.activa .nume-conversatie { font-weight: 600; }
  .conversatie .nenumita { color: var(--muted); font-style: italic; }

  .conversatie .numar {
    font-size: 0.7rem;
    color: var(--muted);
  }

  .actiuni { display: none; gap: 2px; }
  .conversatie:hover .actiuni, .conversatie.activa .actiuni { display: flex; }

  .actiuni button {
    padding: 2px 4px;
    background: none;
    border: none;
    border-radius: 6px;
    font-size: 0.8rem;
    line-height: 1;
    cursor: pointer;
    opacity: 0.55;
  }

  .actiuni button:hover { opacity: 1; background: var(--border); }

  .editare {
    flex: 1;
    min-width: 0;
    padding: 3px 6px;
    font: inherit;
    font-size: 0.85rem;
    border: 1px solid var(--cerneala);
    border-radius: 6px;
  }

  .editare:focus { outline: none; }

  .scrim { display: none; }

  .buton-panou {
    display: none;
    padding: 4px 9px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
  }

  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }

  .titlu {
    padding: 14px 24px 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }

  .titlu .text {
    display: flex;
    align-items: baseline;
    gap: 10px;
    min-width: 0;
  }

  .titlu h1 {
    font-size: 1.1rem;
    margin: 0;
  }

  .titlu .subtitlu {
    font-size: 0.85rem;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .roster {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 24px 12px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }

  .chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px 5px 5px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--panel);
    cursor: pointer;
    white-space: nowrap;
    font: inherit;
    color: inherit;
    transition: border-color 0.15s, background 0.15s;
  }

  .chip:hover { border-color: var(--culoare); }

  .chip.selectat {
    border-color: var(--culoare);
    background: var(--fundal);
  }

  .chip .avatar { width: 26px; height: 26px; min-width: 26px; font-size: 0.85rem; }

  .chip .eticheta { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.2; }
  .chip .eticheta b { font-size: 0.8rem; color: var(--culoare); }
  .chip .eticheta small { font-size: 0.68rem; color: var(--muted); }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }

  .gol {
    margin: auto;
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.6;
  }

  .tacere {
    align-self: center;
    color: var(--muted);
    font-size: 0.82rem;
    font-style: italic;
  }

  .mesaj {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    max-width: 100%;
  }

  .mesaj.eu {
    flex-direction: row-reverse;
    align-self: flex-end;
  }

  .avatar {
    width: 36px;
    height: 36px;
    min-width: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    color: #fff;
    background: var(--culoare, #ccc);
  }

  .continut { max-width: 75%; }

  .nume {
    font-size: 0.78rem;
    font-weight: 700;
    margin-bottom: 3px;
    color: var(--culoare, var(--muted));
  }

  .nume .rol {
    font-weight: 400;
    color: var(--muted);
    margin-left: 6px;
  }

  .mesaj.eu .nume { text-align: right; color: var(--muted); }

  .bula {
    background: var(--fundal, var(--panel));
    border: 1px solid var(--border);
    border-left: 3px solid var(--culoare, var(--border));
    border-radius: 4px 14px 14px 4px;
    padding: 10px 14px;
    line-height: 1.45;
    font-size: 0.95rem;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    width: fit-content;
    max-width: 100%;
  }

  .mesaj.eu .bula {
    background: var(--cerneala);
    color: #fff;
    border-color: var(--cerneala);
    border-left-width: 1px;
    border-radius: 14px 4px 4px 14px;
    margin-left: auto;
  }

  .bula.eroare {
    color: #b3261e;
    font-style: italic;
    background: var(--panel);
  }

  .mentiune {
    font-weight: 600;
    color: var(--culoare-mentiune, inherit);
  }

  .mesaj.eu .mentiune { color: #fff; text-decoration: underline; }

  .scrie { display: inline-flex; gap: 4px; align-items: center; height: 1.45em; }

  .scrie i {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--culoare, var(--muted));
    opacity: 0.35;
    animation: puls 1.1s infinite;
  }

  .scrie i:nth-child(2) { animation-delay: 0.18s; }
  .scrie i:nth-child(3) { animation-delay: 0.36s; }

  @keyframes puls {
    0%, 60%, 100% { opacity: 0.25; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-3px); }
  }

  footer {
    padding: 12px 20px 14px;
    background: var(--panel);
    border-top: 1px solid var(--border);
  }

  .zona-input {
    max-width: 760px;
    margin: 0 auto;
    position: relative;
  }

  form { display: flex; gap: 10px; }

  input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: 12px 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    font-size: 0.95rem;
    font-family: inherit;
  }

  input[type="text"]:focus {
    outline: none;
    border-color: var(--cerneala);
  }

  button {
    padding: 0 20px;
    border-radius: 20px;
    border: none;
    background: var(--cerneala);
    color: #fff;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }

  .indiciu {
    font-size: 0.75rem;
    color: var(--muted);
    padding: 7px 16px 0;
    min-height: 1.4em;
  }

  .sugestii {
    position: absolute;
    bottom: calc(100% + 8px);
    left: 0;
    right: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.09);
    overflow: hidden;
    z-index: 5;
  }

  .sugestii[hidden] { display: none; }

  .sugestie {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 0.88rem;
  }

  .sugestie .avatar { width: 26px; height: 26px; min-width: 26px; font-size: 0.85rem; }
  .sugestie b { color: var(--culoare); }
  .sugestie small { color: var(--muted); }
  .sugestie.activa { background: var(--fundal); }

  /* Memoria lunga: stransa intr-un rand cat timp n-o cer, ca sa nu manance din inaltimea
     conversatiei - pe telefon e cel mai scump loc din pagina. */
  .memorie {
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
    padding: 0 24px 12px;
  }

  .cap-memorie {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    font: inherit;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .cap-memorie:hover { color: var(--cerneala); }
  .cap-memorie .sageata { font-size: 0.6rem; }

  .text-memorie {
    margin-top: 8px;
    padding: 10px 12px;
    border-left: 3px solid var(--border);
    border-radius: 0 8px 8px 0;
    background: var(--bg);
    font-size: 0.8rem;
    line-height: 1.5;
    white-space: pre-wrap;
  }

  /* Sub 900px nu mai incape o a doua coloana fara sa strice latimea bulelor, asa ca panoul
     devine sertar peste conversatie: se deschide din butonul din header si se inchide la
     alegerea unei conversatii. Layout-ul de chat ramane neatins, exact ca inainte. */
  @media (max-width: 899px) {
    aside {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 20;
      transform: translateX(-100%);
      transition: transform 0.18s ease;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.16);
    }

    body.panou-deschis aside { transform: none; }

    body.panou-deschis .scrim {
      display: block;
      position: fixed;
      inset: 0;
      z-index: 15;
      background: rgba(0, 0, 0, 0.32);
    }

    .buton-panou { display: block; }

    /* Pe ecran mic nu exista hover, deci butoanele de redenumit si sters stau mereu la vedere. */
    .actiuni { display: flex; }
  }

  @media (max-width: 600px) {
    .titlu, .roster, .memorie { padding-left: 14px; padding-right: 14px; }
    .titlu .text { flex-direction: column; align-items: flex-start; gap: 2px; }
    .chip .eticheta small { display: none; }
    main { padding: 14px; }
    .continut { max-width: 82%; }
    footer { padding: 10px 12px 12px; }
    .sugestie small { display: none; }
  }
</style>
</head>
<body>

<aside>
  <div class="cap-panou">
    <h2>Conversații</h2>
    <button type="button" class="buton-mic" id="buton-conversatie-noua">+ Nouă</button>
  </div>
  <div class="lista-conversatii" id="lista-conversatii"></div>
</aside>

<div class="scrim" id="scrim"></div>

<div class="coloana">
  <header>
    <div class="titlu">
      <button type="button" class="buton-panou" id="buton-panou" aria-label="Lista de conversații">☰</button>
      <div class="text">
        <h1>Consiliul CoSiMa</h1>
        <span class="subtitlu" id="subtitlu"></span>
      </div>
    </div>
    <div class="roster" id="roster"></div>
    <div class="memorie" id="memorie" hidden>
      <button type="button" class="cap-memorie" id="buton-memorie" aria-expanded="false">
        <span class="sageata">▸</span> Ce ține minte consiliul
      </button>
      <div class="text-memorie" id="text-memorie" hidden></div>
    </div>
  </header>

  <main id="conversatie"></main>

  <footer>
    <div class="zona-input">
      <div class="sugestii" id="sugestii" hidden></div>
      <form id="form-mesaj">
        <!-- maxlength = LITERE_IN_MESAJ din backend/main.py: peste atat, Ollama scoate system
             prompt-ul din fereastra si raspunde un asistent generic, fara personaj. Oprit aici,
             refuzul serverului nu se vede niciodata din pagina. -->
        <input type="text" id="input-mesaj" maxlength="2000" placeholder="Scrie un mesaj în consiliu..." autocomplete="off" />
        <button type="submit">Trimite</button>
      </form>
      <div class="indiciu" id="indiciu"></div>
    </div>
  </footer>
</div>

<script>
  const conversatie = document.getElementById("conversatie");
  const listaConversatii = document.getElementById("lista-conversatii");
  const subtitlu = document.getElementById("subtitlu");
  const scrim = document.getElementById("scrim");
  const butonPanou = document.getElementById("buton-panou");
  const butonNoua = document.getElementById("buton-conversatie-noua");
  const roster = document.getElementById("roster");
  const memorie = document.getElementById("memorie");
  const butonMemorie = document.getElementById("buton-memorie");
  const textMemorie = document.getElementById("text-memorie");
  const sugestii = document.getElementById("sugestii");
  const indiciu = document.getElementById("indiciu");
  const form = document.getElementById("form-mesaj");
  const input = document.getElementById("input-mesaj");

  let personaje = [];
  let utilizator = { nume: "Simona", avatar: "🙋", culoare: "#3D3A36" };
  let indexSugestie = 0;
  // Panoul de memorie ramane cum l-am lasat cand trec de la o conversatie la alta.
  let memoriaDeschisa = false;
  // Frana rundei in curs: scriu peste ea oricand, fara sa astept consiliul.
  let rundaCurenta = null;

  // Dupa runda mea, conversatia mai merge singura cateva replici. Cate si cat se asteapta intre
  // ele le spune serverul, in evenimentul `continua` - pagina nu-si alege singura secundele.
  let replicileRamase = 0;
  let rundaAutonoma = null;
  let pauzaSecunde = [0, 0];
  let ceasAutonom = null;

  let conversatii = [];
  let conversatieActiva = null;

  // Conversatia deschisa se tine in browser, nu pe server: nu exista cont, iar serverul n-are
  // de unde sti in care dintre ele ma uit. La refresh ma intorc unde eram; daca intre timp a
  // fost stearsa, cad pe cea mai recenta.
  const CHEIE_ACTIVA = "consiliu.conversatieActiva";
  const TITLU_NENUMITA = "Conversație nouă";

  // ---------- conversatii ----------

  function deschidePanou(deschis) {
    document.body.classList.toggle("panou-deschis", deschis);
  }

  function titluAfisat(c) {
    return c.titlu || TITLU_NENUMITA;
  }

  function actualizeazaSubtitlul() {
    const activa = conversatii.find((c) => c.id === conversatieActiva);
    subtitlu.textContent = activa ? titluAfisat(activa) : "";
  }

  function butonActiune(semn, titlu, actiune) {
    const buton = document.createElement("button");
    buton.type = "button";
    buton.textContent = semn;
    buton.title = titlu;
    buton.addEventListener("click", (ev) => {
      ev.stopPropagation(); // altfel apasarea pe buton ar si deschide conversatia
      actiune();
    });
    return buton;
  }

  function deseneazaConversatii() {
    listaConversatii.textContent = "";
    for (const c of conversatii) {
      const rand = document.createElement("div");
      rand.className = "conversatie" + (c.id === conversatieActiva ? " activa" : "");

      const nume = document.createElement("span");
      nume.className = "nume-conversatie" + (c.titlu ? "" : " nenumita");
      nume.textContent = titluAfisat(c);

      const numar = document.createElement("span");
      numar.className = "numar";
      numar.textContent = c.numarMesaje || "";

      const actiuni = document.createElement("div");
      actiuni.className = "actiuni";
      actiuni.append(
        butonActiune("✏️", "Redenumește", () => editeazaTitlul(c, nume)),
        butonActiune("🗑️", "Șterge", () => stergeConversatia(c))
      );

      rand.append(nume, numar, actiuni);
      rand.addEventListener("click", () => deschideConversatia(c.id));
      listaConversatii.append(rand);
    }
  }

  async function incarcaConversatii() {
    conversatii = await (await fetch("/api/conversatii")).json();
    if (!conversatii.some((c) => c.id === conversatieActiva)) {
      conversatieActiva = conversatii[0]?.id || null;
      localStorage.setItem(CHEIE_ACTIVA, conversatieActiva || "");
    }
    deseneazaConversatii();
    actualizeazaSubtitlul();
  }

  async function deschideConversatia(id) {
    deschidePanou(false);
    if (id === conversatieActiva) return;

    // Runda din conversatia parasita n-are unde sa mai scrie: bulele ei tocmai ies de pe ecran.
    anuleazaRunda();
    conversatieActiva = id;
    localStorage.setItem(CHEIE_ACTIVA, id);
    deseneazaConversatii();
    actualizeazaSubtitlul();
    await incarcaIstoric();
    input.focus();
  }

  async function conversatieNoua() {
    anuleazaRunda();
    const noua = await (await fetch("/api/conversatii", { method: "POST" })).json();
    conversatieActiva = noua.id;
    localStorage.setItem(CHEIE_ACTIVA, noua.id);
    await incarcaConversatii();
    await incarcaIstoric();
    deschidePanou(false);
    input.focus();
  }

  async function stergeConversatia(c) {
    if (!confirm(`Ștergi „${titluAfisat(c)}"? Mesajele ei nu se mai pot recupera.`)) return;
    const eraActiva = c.id === conversatieActiva;
    if (eraActiva) anuleazaRunda();

    conversatii = await (await fetch(`/api/conversatii/${c.id}`, { method: "DELETE" })).json();
    if (eraActiva) {
      // Serverul lasa mereu macar una in urma, deci am unde sa fiu dusa.
      conversatieActiva = conversatii[0].id;
      localStorage.setItem(CHEIE_ACTIVA, conversatieActiva);
      await incarcaIstoric();
    }
    deseneazaConversatii();
    actualizeazaSubtitlul();
  }

  /** Redenumire pe loc: titlul din lista devine casuta de scris, Enter salveaza, Escape renunta. */
  function editeazaTitlul(c, element) {
    const camp = document.createElement("input");
    camp.type = "text";
    camp.className = "editare";
    camp.value = c.titlu;
    camp.placeholder = TITLU_NENUMITA;
    element.replaceWith(camp);
    camp.focus();
    camp.select();
    camp.addEventListener("click", (ev) => ev.stopPropagation());

    async function salveaza() {
      camp.disabled = true; // si ca sa nu salveze de doua ori: Enter muta focusul, deci da si blur
      await fetch(`/api/conversatii/${c.id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ titlu: camp.value.trim() }),
      });
      await incarcaConversatii();
    }

    camp.addEventListener("keydown", (ev) => {
      ev.stopPropagation(); // Escape aici renunta la redenumire, nu inchide panoul
      if (ev.key === "Enter") salveaza();
      else if (ev.key === "Escape") deseneazaConversatii();
    });
    camp.addEventListener("blur", () => {
      if (!camp.disabled) deseneazaConversatii();
    });
  }

  butonNoua.addEventListener("click", conversatieNoua);
  butonPanou.addEventListener("click", () => {
    deschidePanou(!document.body.classList.contains("panou-deschis"));
  });
  scrim.addEventListener("click", () => deschidePanou(false));
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") deschidePanou(false);
  });

  // ---------- identitate ----------

  function aplicaIdentitate(element, profil) {
    element.style.setProperty("--culoare", profil.culoare || "#ccc");
    element.style.setProperty("--fundal", profil.culoareFundal || "#fff");
  }

  function creeazaAvatar(profil) {
    const el = document.createElement("div");
    el.className = "avatar";
    el.textContent = profil.avatar || "💬";
    return el;
  }

  function dupaEticheta(eticheta) {
    const cautat = eticheta.toLowerCase();
    return personaje.find((p) => p.nume.toLowerCase() === cautat || p.id.toLowerCase() === cautat);
  }

  // ---------- memoria lunga ----------

  /** Rezumatul sedintei, asa cum il tine consiliul. Fara text, randul nici nu apare. */
  function arataRezumat(text) {
    memorie.hidden = !text;
    textMemorie.textContent = text || "";
    textMemorie.hidden = !memoriaDeschisa;
    butonMemorie.setAttribute("aria-expanded", String(memoriaDeschisa));
    butonMemorie.firstElementChild.textContent = memoriaDeschisa ? "▾" : "▸";
  }

  async function incarcaRezumat() {
    if (!conversatieActiva) return arataRezumat("");
    const raspuns = await fetch(`/api/conversatii/${conversatieActiva}/rezumat`);
    arataRezumat((await raspuns.json()).rezumat);
  }

  butonMemorie.addEventListener("click", () => {
    memoriaDeschisa = !memoriaDeschisa;
    arataRezumat(textMemorie.textContent);
  });

  // ---------- scroll ----------

  function lipitDeFinal() {
    return conversatie.scrollHeight - conversatie.scrollTop - conversatie.clientHeight < 90;
  }

  function laFinal() {
    conversatie.scrollTop = conversatie.scrollHeight;
  }

  // ---------- mesaje ----------

  /** Scrie textul in bula, cu @mentiunile evidentiate in culoarea personajului chemat. */
  function scrieText(bula, text) {
    bula.textContent = "";
    const bucati = text.split(/(@\w+)/);
    for (const bucata of bucati) {
      const potrivire = bucata.match(/^@(\w+)$/);
      const personaj = potrivire && dupaEticheta(potrivire[1]);
      if (!personaj) {
        bula.append(document.createTextNode(bucata));
        continue;
      }
      const span = document.createElement("span");
      span.className = "mentiune";
      span.style.setProperty("--culoare-mentiune", personaj.culoare);
      span.textContent = bucata;
      bula.append(span);
    }
  }

  function adaugaMesaj(mesaj) {
    const eraJos = lipitDeFinal();
    document.getElementById("gol")?.remove();
    // Mesajele din istoric isi iau identitatea din profilul curent, ca sa nu ramana cu o
    // culoare veche daca personajul se schimba in personaje.json.
    const profil = personaje.find((p) => p.id === mesaj.personajId) || mesaj;

    const element = document.createElement("div");
    element.className = "mesaj" + (mesaj.eu ? " eu" : "");
    aplicaIdentitate(element, profil);

    const avatar = creeazaAvatar(profil);

    const nume = document.createElement("div");
    nume.className = "nume";
    nume.textContent = profil.nume || "";
    if (profil.rol && !mesaj.eu) {
      const rol = document.createElement("span");
      rol.className = "rol";
      rol.textContent = profil.rol;
      nume.append(rol);
    }

    const bula = document.createElement("div");
    bula.className = "bula";
    scrieText(bula, mesaj.text || "");

    const continut = document.createElement("div");
    continut.className = "continut";
    continut.append(nume, bula);

    element.append(avatar, continut);
    conversatie.append(element);

    if (eraJos || mesaj.eu) laFinal();
    return { element, avatar, nume, bula };
  }

  /** Bula cu punctele animate, cat timp personajul se gandeste. */
  function adaugaIndicator(profil) {
    const mesaj = adaugaMesaj({ ...profil, text: "" });
    const puncte = document.createElement("span");
    puncte.className = "scrie";
    puncte.append(document.createElement("i"), document.createElement("i"), document.createElement("i"));
    mesaj.bula.append(puncte);
    laFinal();
    return mesaj;
  }

  function completeazaIdentitatea(mesaj, profil) {
    aplicaIdentitate(mesaj.element, profil);
    mesaj.avatar.textContent = profil.avatar;
    mesaj.nume.textContent = profil.nume;
    const rol = document.createElement("span");
    rol.className = "rol";
    rol.textContent = profil.rol;
    mesaj.nume.append(rol);
  }

  // ---------- roster si mentiuni ----------

  function mentiuniDinText(text) {
    const gasite = [];
    for (const potrivire of text.matchAll(/@(\w+)/g)) {
      const personaj = dupaEticheta(potrivire[1]);
      if (personaj && !gasite.includes(personaj)) gasite.push(personaj);
    }
    return gasite;
  }

  function comutaMentiune(personaj) {
    const tipar = new RegExp(`@${personaj.nume}\\s*`, "i");
    input.value = tipar.test(input.value)
      ? input.value.replace(tipar, "").trim()
      : `${input.value.trim()} @${personaj.nume} `.trimStart();
    input.focus();
    actualizeazaIndiciu();
  }

  function deseneazaRoster() {
    roster.textContent = "";
    for (const personaj of personaje) {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip";
      chip.dataset.id = personaj.id;
      aplicaIdentitate(chip, personaj);

      const eticheta = document.createElement("span");
      eticheta.className = "eticheta";
      const nume = document.createElement("b");
      nume.textContent = personaj.nume;
      const rol = document.createElement("small");
      rol.textContent = personaj.rol;
      eticheta.append(nume, rol);

      chip.append(creeazaAvatar(personaj), eticheta);
      chip.addEventListener("click", () => comutaMentiune(personaj));
      roster.append(chip);
    }
  }

  function actualizeazaIndiciu() {
    const chemate = mentiuniDinText(input.value);
    const numeChemate = chemate.map((p) => p.nume);

    for (const chip of roster.children) {
      chip.classList.toggle("selectat", chemate.some((p) => p.id === chip.dataset.id));
    }

    // Cei chemati raspund sigur; peste ei intra cel mult unul, tras la sorti. Fara nicio
    // mentiune vorbesc doi-trei alesi, nu tot consiliul (M15).
    indiciu.textContent = chemate.length
      ? `Răspunde sigur: ${numeChemate.join(", ")} — rar se mai bagă și altcineva.`
      : "Fără @mențiune vorbesc doi-trei, trași la sorți.";
  }

  // ---------- autocomplete pentru @ ----------

  function tokenDeCompletat() {
    const panaLaCursor = input.value.slice(0, input.selectionStart);
    const potrivire = panaLaCursor.match(/@(\w*)$/);
    if (!potrivire) return null;
    return { prefix: potrivire[1], start: input.selectionStart - potrivire[0].length };
  }

  function inchideSugestiile() {
    sugestii.hidden = true;
    sugestii.textContent = "";
  }

  function alegeSugestia(personaj) {
    const token = tokenDeCompletat();
    if (!token) return;
    const dupaCursor = input.value.slice(input.selectionStart);
    const inainte = input.value.slice(0, token.start);
    input.value = `${inainte}@${personaj.nume} ${dupaCursor}`;
    const pozitie = inainte.length + personaj.nume.length + 2;
    input.setSelectionRange(pozitie, pozitie);
    inchideSugestiile();
    input.focus();
    actualizeazaIndiciu();
  }

  function actualizeazaSugestiile() {
    const token = tokenDeCompletat();
    if (!token) return inchideSugestiile();

    const potrivite = personaje.filter((p) => p.nume.toLowerCase().startsWith(token.prefix.toLowerCase()));
    if (!potrivite.length) return inchideSugestiile();

    indexSugestie = Math.min(indexSugestie, potrivite.length - 1);
    sugestii.textContent = "";
    potrivite.forEach((personaj, i) => {
      const rand = document.createElement("div");
      rand.className = "sugestie" + (i === indexSugestie ? " activa" : "");
      aplicaIdentitate(rand, personaj);

      const nume = document.createElement("b");
      nume.textContent = personaj.nume;
      const rol = document.createElement("small");
      rol.textContent = personaj.rol;

      rand.append(creeazaAvatar(personaj), nume, rol);
      rand.addEventListener("mousedown", (ev) => {
        ev.preventDefault();
        alegeSugestia(personaj);
      });
      sugestii.append(rand);
    });
    sugestii.hidden = false;
    sugestii.dataset.potrivite = potrivite.map((p) => p.id).join(",");
  }

  input.addEventListener("input", () => {
    indexSugestie = 0;
    actualizeazaSugestiile();
    actualizeazaIndiciu();
    programeazaReplicaAutonoma();
  });

  input.addEventListener("blur", inchideSugestiile);

  input.addEventListener("keydown", (ev) => {
    if (sugestii.hidden) return;
    const ids = (sugestii.dataset.potrivite || "").split(",");

    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      ev.preventDefault();
      const pas = ev.key === "ArrowDown" ? 1 : -1;
      indexSugestie = (indexSugestie + pas + ids.length) % ids.length;
      actualizeazaSugestiile();
    } else if (ev.key === "Enter" || ev.key === "Tab") {
      ev.preventDefault();
      alegeSugestia(personaje.find((p) => p.id === ids[indexSugestie]));
    } else if (ev.key === "Escape") {
      inchideSugestiile();
    }
  });

  // ---------- pornire ----------

  async function incarcaProfiluri() {
    const raspuns = await fetch("/api/personaje");
    const date = await raspuns.json();
    personaje = date.personaje;
    utilizator = date.utilizator;
    deseneazaRoster();
    actualizeazaIndiciu();
  }

  async function incarcaIstoric() {
    conversatie.textContent = "";
    await incarcaRezumat();
    if (!conversatieActiva) return;

    const raspuns = await fetch(`/api/conversatii/${conversatieActiva}/mesaje`);
    const mesaje = await raspuns.json();

    if (!mesaje.length) {
      const gol = document.createElement("div");
      gol.className = "gol";
      gol.id = "gol";
      gol.append(
        "Consiliul așteaptă prima întrebare.",
        document.createElement("br"),
        "Scrie tuturor sau cheamă pe cineva anume cu @Nume."
      );
      conversatie.append(gol);
      return;
    }

    mesaje.forEach(adaugaMesaj);
    laFinal();
  }

  conversatieActiva = localStorage.getItem(CHEIE_ACTIVA);
  incarcaProfiluri().then(incarcaConversatii).then(incarcaIstoric);

  // ---------- runda de raspunsuri ----------

  /** Citeste fluxul NDJSON si da inapoi cate un eveniment, cum vine de la server. */
  async function* evenimente(corp) {
    const reader = corp.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      let capat;
      while ((capat = buffer.indexOf("\n")) !== -1) {
        const linie = buffer.slice(0, capat).trim();
        buffer = buffer.slice(capat + 1);
        if (linie) yield JSON.parse(linie);
      }
    }
  }

  function anuleazaRunda() {
    // Serverul afla din conexiunea inchisa ca poate opri generarea; nu mai arde tokeni pentru
    // o runda pe care n-o mai vede nimeni.
    rundaCurenta?.abort();
    rundaCurenta = null;
    opresteReplicileAutonome();
  }

  /** Citeste un flux de replici - al rundei mele sau al uneia pe care si-o da consiliul singur. */
  async function ruleazaFlux(cale, corp, optiuni = {}) {
    const frana = new AbortController();
    rundaCurenta = frana;
    let curent = adaugaIndicator({ nume: "", avatar: "💬", culoare: "#ccc", culoareFundal: "#fff" });
    let textCurent = "";
    let aVenitCeva = false;

    try {
      const raspuns = await fetch(cale, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(corp),
        signal: frana.signal,
      });

      // Un răspuns care nu e flux (404 pe o conversație ștearsă, 422 pe un mesaj prea lung,
      // 500) n-are evenimente de citit: fără ramura asta, punctele s-ar învârti până la
      // următorul mesaj și n-aș ști de ce.
      if (!raspuns.ok) {
        curent.bula.className = "bula eroare";
        curent.bula.textContent = `serverul a refuzat cererea (${raspuns.status})`;
        return false;
      }

      optiuni.laPornire?.();

      for await (const eveniment of evenimente(raspuns.body)) {
        aVenitCeva = true;

        if (eveniment.tip === "personaj") {
          if (!curent) curent = adaugaIndicator(eveniment);
          else completeazaIdentitatea(curent, eveniment);
          textCurent = "";
          continue;
        }

        if (eveniment.tip === "continua") {
          // Consiliul mai are de zis cateva replici de la sine; pagina le cere una cate una.
          rundaAutonoma = eveniment.runda;
          replicileRamase = eveniment.replici;
          pauzaSecunde = eveniment.pauzaSecunde;
          continue;
        }

        if (eveniment.tip === "rezumat") {
          // Consiliul si-a refacut memoria la capatul rundei. Nu e o replica, deci nu atinge
          // nicio bula - doar randul din header.
          arataRezumat(eveniment.text);
          continue;
        }

        if (eveniment.tip === "consiliul_tace") {
          // Nimeni n-a avut ce raspunde. Vine cand nu mai e nicio bula pe ecran, deci se
          // trateaza inaintea gardei de mai jos; altfel ecranul ar ramane neschimbat si n-ai
          // putea distinge tacerea consiliului de un server picat.
          const nota = document.createElement("div");
          nota.className = "tacere";
          nota.textContent = "Consiliul n-a avut ce adăuga.";
          conversatie.append(nota);
          laFinal();
          continue;
        }

        if (!curent) continue;

        if (eveniment.tip === "text") {
          const eraJos = lipitDeFinal();
          textCurent += eveniment.text;
          scrieText(curent.bula, textCurent);
          if (eraJos) laFinal();
        } else if (eveniment.tip === "eroare") {
          curent.bula.className = "bula eroare";
          curent.bula.textContent = eveniment.text;
          curent = null;
        } else if (eveniment.tip === "tace") {
          // N-a avut ce adauga. Bula de "scrie..." apucase sa apara, deci o luam de pe ecran.
          curent.element.remove();
          curent = null;
        } else if (eveniment.tip === "gata") {
          curent = null;
        }
      }
    } catch (eroare) {
      if (frana.signal.aborted) {
        // Am scris peste runda asta. Replica pe jumatate scrisa n-a ajuns in istoric, deci
        // n-are ce cauta nici pe ecran - la refresh oricum n-ar mai fi acolo.
        curent?.element.remove();
        return false;
      }
      console.error(eroare);
    } finally {
      if (rundaCurenta === frana) rundaCurenta = null;
    }

    // O replica autonoma pe care serverul o refuza (runda ei nu mai e cea curenta) vine ca flux
    // gol: bula pleaca de pe ecran fara nicio vorba despre erori, pentru ca nu e niciuna.
    if (!aVenitCeva && optiuni.linisteAdmisa) {
      curent?.element.remove();
      return false;
    }

    // Daca fluxul s-a intrerupt inainte de primul cuvant, nu lasam punctele sa se invarta la infinit.
    if (curent && !textCurent) {
      curent.bula.className = "bula eroare";
      curent.bula.textContent = "răspunsul s-a întrerupt — verifică dacă serverul și Ollama rulează";
    }
    return true;
  }

  async function ruleazaRunda(text) {
    // Mesajul meu e deja salvat cand vine primul eveniment, deci conversatia si-a luat titlul
    // din el si a urcat in capul listei. Se afla atunci, nu la capatul rundei: pana termina
    // consiliul trec zeci de secunde.
    const dusa = await ruleazaFlux(
      `/api/conversatii/${conversatieActiva}/mesaje`,
      { text },
      { laPornire: incarcaConversatii }
    );
    if (dusa) programeazaReplicaAutonoma();
  }

  // ---------- replicile pe care conversatia si le da singura ----------

  function opresteReplicileAutonome() {
    clearTimeout(ceasAutonom);
    ceasAutonom = null;
    replicileRamase = 0;
    rundaAutonoma = null;
  }

  function programeazaReplicaAutonoma() {
    // Regula 3 din sesiunea 11: cat am text in caseta, nimeni nu vorbeste. Se reia cand trimit
    // sau cand golesc caseta - scrisul in caseta cheama iar functia asta.
    if (input.value.trim()) {
      clearTimeout(ceasAutonom);
      ceasAutonom = null;
      return;
    }
    // Ceasul deja pornit nu se ia de la capat: altfel orice tasta apasata si stearsa ar amana
    // replica la nesfarsit.
    if (!replicileRamase || ceasAutonom) return;

    const [minim, maxim] = pauzaSecunde;
    ceasAutonom = setTimeout(ruleazaReplicaAutonoma, (minim + Math.random() * (maxim - minim)) * 1000);
  }

  async function ruleazaReplicaAutonoma() {
    ceasAutonom = null;
    if (!replicileRamase || input.value.trim()) return;

    replicileRamase -= 1;
    const dusa = await ruleazaFlux(
      `/api/conversatii/${conversatieActiva}/continuare`,
      { runda: rundaAutonoma },
      { linisteAdmisa: true }
    );
    if (dusa) programeazaReplicaAutonoma();
  }

  form.addEventListener("submit", (ev) => {
    ev.preventDefault();
    const text = input.value.trim();
    if (!text || !conversatieActiva) return;

    // Am prioritate fata de consiliu: runda in curs se taie inainte sa inceapa alta, ca sa nu
    // scrie doua runde peste acelasi ecran.
    anuleazaRunda();

    adaugaMesaj({ ...utilizator, eu: true, text });
    input.value = "";
    inchideSugestiile();
    actualizeazaIndiciu();
    input.focus();

    // Fara `await`: caseta ramane libera cat vorbeste consiliul.
    ruleazaRunda(text);
  });

</script>
